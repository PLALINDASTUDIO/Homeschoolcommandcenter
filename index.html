<style>
:root{
  --bg:#f8f8fc;--sidebar-bg:#ffffff;--surface:#ffffff;--surface-2:#f6f4fd;--text:#171a3a;--muted:#6f7285;
  --border:#e8e7f1;--accent:#7357e8;--accent-2:#9068f4;--accent-tint:#f0ecff;
  --mint:#28b99a;--mint-tint:#eaf9f4;--peach:#ff8a32;--peach-tint:#fff2e8;
  --blue:#348cf3;--blue-tint:#edf5ff;--coral:#f05d87;--coral-tint:#fff0f4;
  --yellow:#f1bc54;--yellow-tint:#fff8e7;--danger:#e85d70;--success:#44b697;
  --shadow:0 8px 30px rgba(73,61,120,.06);--shadow-hover:0 12px 35px rgba(73,61,120,.11);
  --radius:18px;--radius-sm:12px;--sidebar:236px;--transition:200ms ease;
}
body.dark{
  --bg:#17161e;--sidebar-bg:#1d1b25;--surface:#24222d;--surface-2:#2b2935;--text:#f4f2fa;--muted:#aaa6b8;
  --border:#373441;--accent:#9b8cf7;--accent-2:#b4a8ff;--accent-tint:#2b2550;
  --mint:#3fd6ae;--mint-tint:#1c332c;--peach:#ffa564;--peach-tint:#3a2a1c;
  --blue:#6fabfa;--blue-tint:#1c2c42;--coral:#ff8fa8;--coral-tint:#3a2230;
  --yellow:#f4c96e;--yellow-tint:#3a3425;--shadow:0 12px 32px rgba(0,0,0,.24);--shadow-hover:0 18px 42px rgba(0,0,0,.32);
}
body.theme-ocean{--accent:#348cf3;--accent-2:#63a9fb;--accent-tint:#eaf3ff}
body.theme-meadow{--accent:#28b99a;--accent-2:#4fd6bb;--accent-tint:#e8faf4}
body.theme-sunset{--accent:#ff8a32;--accent-2:#ffab63;--accent-tint:#fff3e8}
body.theme-berry{--accent:#f05d87;--accent-2:#ff85a8;--accent-tint:#ffeef4}
body.theme-slate{--accent:#5b6472;--accent-2:#7c8796;--accent-tint:#eef1f4}
body.dark.theme-ocean{--accent:#6fabfa;--accent-2:#8fc0ff;--accent-tint:#1c2c42}
body.dark.theme-meadow{--accent:#3fd6ae;--accent-2:#6ee6c8;--accent-tint:#1c332c}
body.dark.theme-sunset{--accent:#ffa564;--accent-2:#ffbd8a;--accent-tint:#3a2a1c}
body.dark.theme-berry{--accent:#ff8fa8;--accent-2:#ffabbe;--accent-tint:#3a2230}
body.dark.theme-slate{--accent:#9aa4b2;--accent-2:#b6bec9;--accent-tint:#2a2e35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,a,[role="button"],.cal-day,.search-item,.row-click,.item-row,.chip-toggle,.theme-swatch{-webkit-tap-highlight-color:transparent;outline:none}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
svg.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;background:var(--sidebar-bg);border-right:1px solid var(--border);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:20;display:flex;flex-direction:column}
.brand{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:0;padding:6px 4px 12px}
.brand .logo-full{width:100%;max-width:170px;height:auto;display:block;margin:0}
.brand .logo-icon-only{display:none;width:44px;height:auto;margin:0}
body.dark .brand .logo-full{display:none}
body.dark .brand .logo-icon-only{display:block}
.brand-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ffffff;box-shadow:0 4px 14px rgba(31,22,74,.14);padding:5px;flex-shrink:0}
.brand-icon img{width:100%;height:100%;object-fit:contain;display:block}

.mode-btn{width:100%;justify-content:center;border:1.5px solid transparent;background:var(--accent-tint);color:var(--accent);border-radius:12px;padding:13px 14px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:all var(--transition);cursor:pointer;position:relative;overflow:hidden}
.mode-btn:before{content:"";position:absolute;top:-26px;right:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.32;pointer-events:none}

.mode-btn:active{transform:scale(.97)}
.challenge-subject-card{padding:18px;text-align:center}

body.mode-student [data-parent-only]{display:none!important}

.field-error-msg svg{width:11px;height:11px;flex-shrink:0}

.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}.table th{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}

.table tbody tr.row-click:active{background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}

.mobile-backdrop{display:none}

 fields.forEach(([id,val])=>{

   markFieldError(id,'Required — please fill this in');
   if(!firstBad)firstBad=id;
   ok=false;
  }
 });

  toast('Please fill in the highlighted field(s)');
  document.getElementById(firstBad)?.focus();

 }
 return ok;

function dashboardMetrics(){
  const lessons=forStudent(state.lessons),done=lessons.filter(l=>l.status==='completed');
  const learningMinutes=done.reduce((s,l)=>s+(Number(l.duration)||0),0);
  const att=forStudent(state.attendance);
  const equivalent=att.reduce((s,a)=>s+(a.status==='present'?1:a.status==='half'?.5:0),0);
  const goals=forStudent(state.goals);
  const goalPct=goals.length?Math.round(goals.reduce((s,g)=>s+safePct(Number(g.current),Number(g.target)),0)/goals.length):0;
  return {done:done.length,learningMinutes,attendancePct:safePct(equivalent,att.length),goalPct};
}
function subjectProgress(subject){
  const curr=forStudent(state.curriculum).find(c=>c.subject===subject);
  if(curr)return safePct(curr.completedLessons,curr.totalLessons);
  const ls=forStudent(state.lessons).filter(l=>l.subject===subject);
  return safePct(ls.filter(l=>l.status==='completed').length,ls.length);
}
function gradeAverage(){
  const a=forStudent(state.assessments);if(!a.length)return 0;
  const totalW=a.reduce((s,x)=>s+(Number(x.weight)||0),0);
  if(!totalW)return Math.round(a.reduce((s,x)=>s+(Number(x.score)/Number(x.max)*100),0)/a.length);
  return Math.round(a.reduce((s,x)=>s+((Number(x.score)/Number(x.max)*100)*(Number(x.weight)||0)),0)/totalW);
}
function missedLessons(){return forStudent(state.lessons).filter(l=>l.status!=='completed' && l.date<todayISO())}

function formatRelativeDate(iso){
 const diff=Math.round((new Date(iso)-new Date(todayISO()))/86400000);
 if(diff<0)return 'Overdue';
 if(diff===0)return 'Today';
 if(diff===1)return 'Due Tomorrow';
 if(diff<7)return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'});
 return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function calendarHTML(y,m){
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let html='<div class="mini-calendar">'+['S','M','T','W','T','F','S'].map(x=>`<div class="cal-head">${x}</div>`).join('');
  for(let i=0;i<first;i++)html+='<span class="cal-day empty"></span>';
  for(let day=1;day<=days;day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const has=forStudent(state.lessons).some(x=>x.date===iso)||forStudent(state.assignments).some(x=>x.dueDate===iso)||forStudent(state.activities).some(x=>x.date===iso);
    html+=`<button class="cal-day ${iso===todayISO()?'today':''} ${has?'has-event':''}" onclick="openDayDetail('${iso}')">${day}</button>`;

function schoolYearProgress(schoolYearStr){
 const m=(schoolYearStr||'').match(/(\d{4}).*?(\d{4})/);
 if(!m)return null;
 const startYear=parseInt(m[1]);
 const start=new Date(startYear,8,1);
 const end=new Date(startYear+1,5,30);
 const now=new Date();
 if(now<start)return 0;
 if(now>end)return 100;
 return Math.round((now-start)/(end-start)*100);
}
function dayIndexSeed(len){
 const d=todayISO();
 let hash=0;for(let i=0;i<d.length;i++)hash=(hash*31+d.charCodeAt(i))|0;
 return Math.abs(hash)%len;
}
function dashboardSubtitle(isStudentMode,s){

  if((s.streak||0)>=3)return `You're on a ${s.streak}-day streak — keep it up!`;
  const pool=["Let's see what's on your plan today.","Ready to learn something new?","Let's make today count!","Here's your day ahead.","Time to shine today!","Let's get started!"];
  return pool[dayIndexSeed(pool.length)];
 }

 if(missed>0)return `${missed} lesson${missed>1?'s':''} need${missed>1?'':'s'} catching up — Smart Catch-Up can help.`;
 const pool=['Here’s how your homeschool is going today.',"Here's today's homeschool snapshot.","Let's see how things are going today.","Your homeschool day, at a glance.","Here's what's happening today.","Everything on track — here's today's view."];
 return pool[dayIndexSeed(pool.length)];
}

 }
 let body='';
 if(missed.length){
  body+=`<div class="panel">
   <div class="panel-title"><div><h2>Missed Lessons</h2><p>${missed.length} lesson${missed.length>1?'s':''} behind, oldest first</p></div></div>
   ${missed.map(x=>`<div class="lesson"><div class="icon-chip tint-coral">${icon('i-alert')}</div><div><b>${esc(x.subject)} — ${esc(x.title)}</b><small>Original date: ${x.date}</small></div><span class="status missed">Missed</span></div>`).join('')}
   <button class="btn-block" onclick="createCatchupPlan()">${icon('i-zap')}Create 2-Week Catch-Up Plan</button>
  </div>`;
 }
 if(rescheduled.length){

  rescheduled.forEach(l=>{(byDay[l.date]=byDay[l.date]||[]).push(l)});
  const days=Object.keys(byDay).sort();

   ${days.map(d=>{const dt=new Date(d+'T00:00:00');const label=dt.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});return `<div style="margin-bottom:10px"><div style="font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;margin-bottom:6px">${label.toUpperCase()}</div>${byDay[d].map(l=>`<div class="lesson clickable" onclick="openLesson('${l.id}')"><div class="icon-chip ${SUBJECT_COLORS[l.subject]?'tint-'+SUBJECT_COLORS[l.subject]:'tint-purple'}">${icon('i-zap')}</div><div><b>${esc(l.subject)} — ${esc(l.title)}</b><small>Originally due ${esc(l.originalDate||'')} · ${l.duration} min</small></div><span class="status todo">Scheduled</span></div>`).join('')}</div>`}).join('')}
  </div>`;
 }
 return head+body;

function createCatchupPlan(){
 const missed=missedLessons().slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(!missed.length)return;
 const horizonDays=14,maxPerDay=2;
 const candidates=[];
 for(let i=1;i<=horizonDays;i++){const d=new Date();d.setDate(d.getDate()+i);if(d.getDay()!==0&&d.getDay()!==6)candidates.push(d.toISOString().slice(0,10))}
 const existing=forStudent(state.lessons).filter(l=>l.status!=='completed');
 const dayLoad={},daySubjects={};
 candidates.forEach(d=>{dayLoad[d]=existing.filter(l=>l.date===d).length;daySubjects[d]=new Set(existing.filter(l=>l.date===d).map(l=>l.subject))});
 missed.forEach(l=>{
  let best=null,bestScore=Infinity;
  for(const d of candidates){
   if(dayLoad[d]>=maxPerDay)continue;
   const sameSubjectPenalty=daySubjects[d].has(l.subject)?100:0;
   const score=dayLoad[d]*10+sameSubjectPenalty;
   if(score<bestScore){bestScore=score;best=d}
  }
  if(!best)best=candidates.reduce((a,b)=>dayLoad[a]<=dayLoad[b]?a:b);
  l.originalDate=l.date;l.date=best;l.status='todo';l.rescheduled=true;
  dayLoad[best]=(dayLoad[best]||0)+1;
  (daySubjects[best]=daySubjects[best]||new Set()).add(l.subject);
 });
 saveState();navigate('catchup');toast('Catch-up plan created — spread across the next 2 weeks');
}

function showReport(type){
 const s=activeStudent();let html='';
 if(type==='progress'){const m=dashboardMetrics();html=`<h2 style="margin-top:0">Progress Report — ${esc(s.firstName)}</h2><p style="color:var(--muted);font-size:12px">${state.settings.schoolYear}</p><div class="grid stats" style="margin-top:14px">${simpleStatCard('i-check','tint-purple','Lessons Completed',m.done,'Total','planner')}${simpleStatCard('i-target','tint-blue','Goals Progress',m.goalPct+'%','Average','goals')}${simpleStatCard('i-calendar','tint-mint','Attendance',m.attendancePct+'%','Rate','attendance')}${simpleStatCard('i-chart','tint-peach','Grade Average',gradeAverage()+'%','Weighted','grades')}</div>`;}
 else if(type==='attendance'){const a=forStudent(state.attendance);const present=a.filter(x=>x.status==='present').length,half=a.filter(x=>x.status==='half').length,absent=a.filter(x=>x.status==='absent').length;html=`<h2 style="margin-top:0">Attendance Report</h2><div class="table-scroll"><table class="table"><tr><th>Total Days</th><td>${a.length}</td></tr><tr><th>Present</th><td>${present}</td></tr><tr><th>Half Days</th><td>${half}</td></tr><tr><th>Absent</th><td>${absent}</td></tr><tr><th>Rate</th><td>${safePct(present+half*0.5,a.length)}%</td></tr></table></div>`;}
 else if(type==='grade'){const a=forStudent(state.assessments);html=`<h2 style="margin-top:0">Grade Report</h2><div class="table-scroll"><table class="table"><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.subject}</td><td>${x.title}</td><td>${Math.round(x.score/x.max*100)}%</td></tr>`).join('')||'<tr><td colspan=3>No assessments recorded</td></tr>'}</tbody></table></div><p style="font-weight:800;margin-top:10px">Overall Average: ${gradeAverage()}%</p>`;}
 else if(type==='reading'){const r=forStudent(state.reading);const pages=r.reduce((s,x)=>s+(x.pagesRead||0),0);html=`<h2 style="margin-top:0">Reading Report</h2><div class="table-scroll"><table class="table"><tr><th>Books Tracked</th><td>${r.length}</td></tr><tr><th>Books Completed</th><td>${r.filter(x=>x.status==='completed').length}</td></tr><tr><th>Pages Read</th><td>${pages}</td></tr></table></div>`;}
 else if(type==='curriculum'){const c=forStudent(state.curriculum);html=`<h2 style="margin-top:0">Curriculum Report</h2><div class="table-scroll"><table class="table"><thead><tr><th>Subject</th><th>Curriculum</th><th>Progress</th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.subject}</td><td>${x.name}</td><td>${safePct(x.completedLessons,x.totalLessons)}%</td></tr>`).join('')||'<tr><td colspan=3>No curriculum added</td></tr>'}</tbody></table></div>`;}
 else if(type==='summary'){const m=dashboardMetrics();html=`<h2 style="margin-top:0">End-of-Year Summary — ${esc(s.firstName+' '+s.lastName)}</h2><p style="color:var(--muted);font-size:12px">${esc(s.grade)} · ${state.settings.schoolYear}</p><div class="table-scroll"><table class="table"><tr><th>Lessons Completed</th><td>${m.done}</td></tr><tr><th>Learning Hours</th><td>${Math.floor(m.learningMinutes/60)}h ${m.learningMinutes%60}m</td></tr><tr><th>Attendance Rate</th><td>${m.attendancePct}%</td></tr><tr><th>Grade Average</th><td>${gradeAverage()}%</td></tr><tr><th>Portfolio Items</th><td>${forStudent(state.portfolio).length}</td></tr></table></div>`;}
 document.getElementById('reportOutput').innerHTML=html+`<div style="margin-top:14px"><button class="btn btn-soft" onclick="window.print()">${icon('i-download')}Print / Save as PDF</button></div>`;
 document.getElementById('reportOutput').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function viewCalendarPage(){
 initCalState();
 const y=calState.y,m=calState.m;
 const events=[];
 forStudent(state.lessons).forEach(x=>events.push({date:x.date,title:x.subject+' — '+x.title,type:'Lesson',tint:'tint-purple'}));
 forStudent(state.assignments).forEach(x=>events.push({date:x.dueDate,title:x.title,type:'Assignment',tint:'tint-blue'}));
 forStudent(state.assessments).forEach(x=>{if(x.date)events.push({date:x.date,title:x.title,type:'Assessment',tint:'tint-peach'})});
 forStudent(state.activities).forEach(x=>events.push({date:x.date,title:x.title,type:'Activity',tint:'tint-mint'}));
 forStudent(state.goals).forEach(x=>{if(x.deadline)events.push({date:x.deadline,title:x.name,type:'Goal',tint:'tint-coral'})});
 const monthEvents=events.filter(e=>(e.date||'').slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.date.localeCompare(b.date));

/* ===== INSIGHTS ===== */
function weeklyActivityData(){
 const days=[];
 for(let i=6;i>=0;i--){
  const iso=daysFrom(-i);
  const count=forStudent(state.lessons).filter(l=>l.date===iso&&l.status==='completed').length;
  const dayLabel=new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'})[0];
  days.push({iso,count,dayLabel,isToday:iso===todayISO()});
 }
 return days;
}
function attendanceHeatmapData(n){
 const days=[];
 const att=forStudent(state.attendance);
 for(let i=n-1;i>=0;i--){
  const iso=daysFrom(-i);
  const rec=att.find(x=>x.date===iso);
  days.push({iso,status:rec?rec.status:null});
 }
 return days;
}
function viewInsights(){
 const s=activeStudent();
 const allSubjectNames=[...new Set([...forStudent(state.curriculum).map(c=>c.subject),...forStudent(state.lessons).map(l=>l.subject)])].filter(Boolean);
 const subjects=(allSubjectNames.length?allSubjectNames:['Math','Reading','Science','Writing','History']).slice(0,8);
 const perf=subjects.map((sub,i)=>({sub,pct:subjectProgress(sub),color:subjectColorName(sub,i)})).sort((a,b)=>b.pct-a.pct);
 const strongest=perf[0],weakest=perf[perf.length-1];
 const overdue=missedLessons().length;
 const att=forStudent(state.attendance);
 const recentAtt=att.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
 const recentRate=safePct(recentAtt.reduce((s,x)=>s+(x.status==='present'?1:x.status==='half'?.5:0),0),recentAtt.length);
 const up=upcomingItems();
 const week=weeklyActivityData();
 const weekTotal=week.reduce((s,d)=>s+d.count,0);
 const maxDay=Math.max(1,...week.map(d=>d.count));
 const heat=attendanceHeatmapData(28);
 const presentCount=heat.filter(d=>d.status==='present').length;
 const halfCount=heat.filter(d=>d.status==='half').length;
 const absentCount=heat.filter(d=>d.status==='absent').length;
 const loggedCount=presentCount+halfCount+absentCount;
 const periodRate=safePct(presentCount+halfCount*0.5,loggedCount);
 const m=dashboardMetrics();
 const busiestDay=(()=>{const counts={};forStudent(state.lessons).filter(l=>l.status==='completed').forEach(l=>{const dow=new Date(l.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'});counts[dow]=(counts[dow]||0)+1});const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return arr.length?arr[0][0]:null})();
 const recs=[];
 if(overdue>0)recs.push({icon:'i-zap',tint:'tint-coral',text:`${overdue} missed lesson${overdue>1?'s':''} — visit Smart Catch-Up to rebuild the schedule.`});
 if(weakest.pct<60)recs.push({icon:'i-target',tint:'tint-peach',text:`${weakest.sub} is at ${weakest.pct}% — consider scheduling an extra session this week.`});
 if(recentRate<80&&recentAtt.length>0)recs.push({icon:'i-calendar',tint:'tint-blue',text:`Attendance dipped to ${recentRate}% over the last ${recentAtt.length} days — worth a check-in.`});
 if(weekTotal===0)recs.push({icon:'i-alert',tint:'tint-coral',text:`No lessons completed in the last 7 days — the schedule may need attention.`});
 if(!recs.length)recs.push({icon:'i-check',tint:'tint-mint',text:`Everything looks healthy — ${esc(s.firstName)} is on track across the board.`});
 return `<div class="stub-toolbar"><div><h1>Insights</h1><p>What your data says about ${esc(s.firstName)}'s progress.</p></div></div>
 <section class="grid stats">
  ${simpleStatCard('i-target','tint-purple','Overall Progress',Math.round(perf.reduce((a,b)=>a+b.pct,0)/perf.length)+'%','Average across subjects','curriculum')}
  ${simpleStatCard('i-chart','tint-blue','Grade Average',gradeAverage()+'%',forStudent(state.assessments).length+' assessment(s)','grades')}
  ${simpleStatCard('i-calendar','tint-mint','Attendance',m.attendancePct+'%','All-time rate','attendance')}
  ${simpleStatCard('i-clock','tint-peach','This Week',weekTotal+' lessons','Completed in last 7 days','planner')}
 </section>
 <section class="grid dashboard-row3">
  <article class="panel">
   <div class="panel-title"><div><h2>Subject Performance</h2><p>Curriculum progress by subject</p></div></div>
   ${perf.map(p=>`<div class="subject-bar-row"><span class="subject-bar-label" title="${esc(p.sub)}">${esc(p.sub)}</span><div class="subject-bar-track"><div class="subject-bar-fill" style="background:${HEX[p.color]};width:${p.pct}%"></div></div><span class="subject-bar-pct">${p.pct}%</span></div>`).join('')}
  </article>
  <article class="panel">
   <div class="panel-title"><div><h2>7-Day Activity</h2><p>Lessons completed per day</p></div></div>
   <div class="bar-chart">
    ${week.map(d=>`<div class="bar-chart-col"><span class="bar-chart-value">${d.count||''}</span><div class="bar-chart-bar" style="height:${safePct(d.count,maxDay)}%;background:${d.isToday?'var(--accent)':'var(--accent-tint)'}"></div><span class="bar-chart-label" style="${d.isToday?'color:var(--accent)':''}">${d.dayLabel}</span></div>`).join('')}
   </div>
  </article>
  <article class="panel">
   <div class="panel-title"><div><h2>Attendance (Last 28 Days)</h2></div></div>
   <div class="heatmap-grid">${heat.map(d=>{const color=d.status==='present'?'var(--mint)':d.status==='half'?'var(--peach)':d.status==='absent'?'var(--coral)':'var(--surface-2)';return `<div class="heatmap-cell" title="${d.iso}${d.status?': '+d.status:''}" style="background:${color}"></div>`}).join('')}</div>
   <div class="heatmap-legend"><span><i style="background:var(--mint)"></i>Present</span><span><i style="background:var(--peach)"></i>Half</span><span><i style="background:var(--coral)"></i>Absent</span><span><i style="background:var(--surface-2)"></i>No data</span></div>
   <div class="cal-month-summary">
    <div><div class="icon-chip tint-mint" style="width:26px;height:26px;border-radius:9px">${icon('i-target')}</div><div><b>${periodRate}%</b><span>Rate</span></div></div>
    <div><div class="icon-chip tint-purple" style="width:26px;height:26px;border-radius:9px">${icon('i-check')}</div><div><b>${presentCount}</b><span>Present</span></div></div>
    <div><div class="icon-chip tint-coral" style="width:26px;height:26px;border-radius:9px">${icon('i-alert')}</div><div><b>${absentCount}</b><span>Absent</span></div></div>
   </div>
  </article>
 </section>
 <section class="grid dashboard-row3" style="margin-top:14px">
  <article class="panel">
   <div class="panel-title"><h2>Key Insights</h2></div>
   <div class="insight"><div class="icon-chip tint-mint">${icon('i-trend')}</div><div><b>Strongest in ${strongest.sub}</b><br><small style="color:var(--muted)">${strongest.pct}% curriculum progress.</small></div></div>
   <div class="insight"><div class="icon-chip tint-peach">${icon('i-alert')}</div><div><b>${weakest.sub} may need more focus</b><br><small style="color:var(--muted)">Currently the lowest at ${weakest.pct}%.</small></div></div>
   ${busiestDay?`<div class="insight"><div class="icon-chip tint-blue">${icon('i-calendar')}</div><div><b>Most productive day: ${busiestDay}</b><br><small style="color:var(--muted)">Based on completed lesson history.</small></div></div>`:''}
   ${up.length?`<div class="insight"><div class="icon-chip tint-purple">${icon('i-clipboard')}</div><div><b>${up.length} upcoming item(s)</b><br><small style="color:var(--muted)">Next: ${esc(up[0].title)} (${up[0].sub})</small></div></div>`:''}
  </article>
  <article class="panel" style="grid-column:span 2">
   <div class="panel-title"><h2>Recommendations</h2></div>
   ${recs.map(r=>`<div class="recommend-card"><div class="icon-chip ${r.tint}">${icon(r.icon)}</div><div style="font-size:12px;font-weight:600;padding-top:6px">${r.text}</div></div>`).join('')}
  </article>
 </section>`;
}

function gradeBand(grade){
 const idx=GRADE_OPTIONS.indexOf(grade);
 if(idx<0)return 'g35';
 if(idx<=2)return 'g02';
 if(idx<=5)return 'g35';
 return 'g68';
}
function gradeNumber(grade){const m=/Grade (\d+)/.exec(grade||'');return m?Number(m[1]):(grade==='Kindergarten'?0:4)}
function generateMathQuestion(grade){
 const n=gradeNumber(grade),max=n<=1?10:n<=3?50:n<=5?100:1000;
 const a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1;
 const ops=n<=2?['+','-']:n<=5?['+','-','×']:['+','-','×','÷'];
 const op=ops[Math.floor(Math.random()*ops.length)];
 let q,correct;
 if(op==='+'){q=`${a} + ${b}`;correct=a+b}
 else if(op==='-'){const hi=Math.max(a,b),lo=Math.min(a,b);q=`${hi} - ${lo}`;correct=hi-lo}
 else if(op==='×'){const x=Math.floor(Math.random()*12)+1,y=Math.floor(Math.random()*12)+1;q=`${x} × ${y}`;correct=x*y}
 else{const y=Math.floor(Math.random()*10)+2,x=y*(Math.floor(Math.random()*10)+1);q=`${x} ÷ ${y}`;correct=x/y}
 const choices=new Set([correct]);
 while(choices.size<4){const delta=Math.floor(Math.random()*8)-4;const alt=correct+delta;if(alt>=0&&alt!==correct)choices.add(alt)}
 const arr=[...choices].sort(()=>Math.random()-0.5);
 return {question:`What is ${q}?`,choices:arr.map(String),correctAnswer:arr.indexOf(correct),explanation:`${q} = ${correct}.`,xp:10};
}

let challengeState=null;
function viewChallenge(){
 const s=activeStudent();
 const accuracy=s.questionsAnswered?Math.round(s.correctAnswers/s.questionsAnswered*100):0;
 const earnedBadges=BADGE_DEFS.filter(b=>(s.badges||[]).includes(b.id));

   <div><b>${s.xp||0}</b><span>XP</span></div><div><b>${s.streak||0}</b><span>STREAK</span></div><div><b>${s.bestStreak||0}</b><span>BEST</span></div>

function startChallenge(subject){
 if(DEMO_BUILD&&!state.activated){requireChallengeActivation();return}
 const s=activeStudent(),band=gradeBand(s.grade);
 const questions=[];
 for(let i=0;i<5;i++){
  if(subject==='Math')questions.push(generateMathQuestion(s.grade));
  else{const pool=CURATED_QUESTIONS[band][subject];questions.push({...pool[Math.floor(Math.random()*pool.length)],xp:10});}
 }
 challengeState={subject,questions,index:0,correct:0,answered:false};
 renderChallengeQuestion();
}
function renderChallengeQuestion(){
 const c=challengeState,q=c.questions[c.index];
 document.getElementById('viewRoot').innerHTML=`
 <div class="panel" style="max-width:520px;margin:0 auto">
  <div class="panel-title"><div><h2>${c.subject} Challenge</h2><p>Question ${c.index+1} of ${c.questions.length}</p></div><button class="btn btn-soft" onclick="navigate('challenge')">Exit</button></div>
  <p style="font-size:15px;font-weight:700;margin:6px 0 16px">${esc(q.question)}</p>
  <div id="challengeChoices">${q.choices.map((ch,i)=>`<button class="challenge-opt" onclick="answerChallenge(${i})">${esc(ch)}</button>`).join('')}</div>
  <div id="challengeFeedback"></div>
 </div>`;
}
function answerChallenge(i){
 const c=challengeState;if(c.answered)return;c.answered=true;
 const q=c.questions[c.index],correct=i===q.correctAnswer;
 const s=activeStudent();
 s.questionsAnswered=(s.questionsAnswered||0)+1;
 if(!s.correctBySubject)s.correctBySubject={Math:0,Reading:0,Vocabulary:0,Science:0};
 if(correct){c.correct++;s.correctAnswers=(s.correctAnswers||0)+1;s.correctBySubject[c.subject]=(s.correctBySubject[c.subject]||0)+1;s.xp=(s.xp||0)+q.xp}
 document.querySelectorAll('.challenge-opt').forEach((btn,idx)=>{btn.disabled=true;if(idx===q.correctAnswer)btn.classList.add('correct');else if(idx===i)btn.classList.add('wrong')});
 document.getElementById('challengeFeedback').innerHTML=`<div class="insight" style="margin-top:14px;background:${correct?'var(--mint-tint)':'var(--coral-tint)'}"><div class="icon-chip ${correct?'tint-mint':'tint-coral'}">${icon(correct?'i-check':'i-alert')}</div><div><b>${correct?'Correct! +'+q.xp+' XP 🎉':'Not quite'}</b><br><small style="color:var(--muted)">${esc(q.explanation)}</small></div></div><button class="btn btn-primary btn-block" onclick="nextChallengeQuestion()">${c.index<c.questions.length-1?'Next Question':'See Results'}</button>`;
 saveState();
}
function nextChallengeQuestion(){
 const c=challengeState;
 if(c.index<c.questions.length-1){c.index++;c.answered=false;renderChallengeQuestion();return}
 finishChallenge();
}
function finishChallenge(){
 const c=challengeState,s=activeStudent();
 updateStreak(s);
 const newBadges=evaluateBadges(s);
 saveState();
 const accuracy=Math.round(c.correct/c.questions.length*100);
 document.getElementById('viewRoot').innerHTML=`
 <div class="panel" style="max-width:480px;margin:0 auto;text-align:center">
  <div class="icon-chip tint-mint" style="margin:0 auto 14px;width:56px;height:56px"><svg class="icon" style="width:26px;height:26px" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="m9 13-2 8 5-3 5 3-2-8"/></svg></div>
  <h2 style="margin:0 0 4px">Challenge Complete!</h2>
  <p style="color:var(--muted);font-size:12.5px;margin:0 0 18px">${c.subject} · ${activeStudent().grade}</p>
  <div class="student-card-stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${c.correct}/${c.questions.length}</b><span>SCORE</span></div><div><b>${accuracy}%</b><span>ACCURACY</span></div><div><b>+${c.correct*10}</b><span>XP EARNED</span></div></div>
  ${newBadges.length?`<div class="insight" style="margin-top:14px;text-align:left"><div class="icon-chip tint-peach">${icon('i-medal')}</div><div><b>New badge${newBadges.length>1?'s':''} earned!</b><br><small style="color:var(--muted)">${newBadges.map(b=>b.name).join(', ')}</small></div></div>`:''}
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-soft" style="flex:1;justify-content:center" onclick="navigate('challenge')">Back to Challenges</button><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="startChallenge('${c.subject}')">Play Again</button></div>
 </div>`;
}
function updateStreak(s){
 const today=todayISO(),yesterday=daysFrom(-1);
 if(s.lastChallengeDate===today)return;
 if(s.lastChallengeDate===yesterday)s.streak=(s.streak||0)+1;
 else s.streak=1;
 s.bestStreak=Math.max(s.bestStreak||0,s.streak);
 s.lastChallengeDate=today;
}
function evaluateBadges(s){
 if(!s.badges)s.badges=[];
 const fresh=[];
 BADGE_DEFS.forEach(b=>{if(!s.badges.includes(b.id)&&b.cond(s)){s.badges.push(b.id);fresh.push(b)}});
 return fresh;
}

function highlightMatch(text,q){
 const t=esc(text);if(!q)return t;
 const idx=t.toLowerCase().indexOf(q.toLowerCase());
 if(idx===-1)return t;
 return t.slice(0,idx)+`<mark style="background:var(--accent-tint);color:var(--accent);border-radius:3px;padding:0 1px">`+t.slice(idx,idx+q.length)+`</mark>`+t.slice(idx+q.length);
}
function updateSearch(){
 const raw=document.getElementById('globalSearch').value.trim(),q=raw.toLowerCase(),box=document.getElementById('searchDropdown');
 if(!q){box.classList.remove('show');box.innerHTML='';return}
 const hits=allSearchItems().filter(x=>(x.title+' '+x.sub).toLowerCase().includes(q)).slice(0,20);
 if(!hits.length){box.innerHTML='<div class="page-placeholder" style="padding:18px">No matching results</div>';box.classList.add('show');return}
 const groups={};hits.forEach(x=>(groups[x.group]??=[]).push(x));
 box.innerHTML=Object.entries(groups).map(([g,arr])=>`<div class="search-group">${g}</div>${arr.map(x=>`<button class="search-item" onclick="openSearchResult('${x.view}','${x.studentId||''}')"><div>${icon('i-search')}</div><div><b>${highlightMatch(x.title,raw)}</b><small>${highlightMatch(x.sub,raw)}</small></div></button>`).join('')}`).join('');
 box.classList.add('show');
}
